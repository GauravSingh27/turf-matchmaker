<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurfClash | Rival Matchmaking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f14; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-zinc-800 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-emerald-400">⚡ TURFCLASH</h1>
        <p class="text-xs text-zinc-400 mt-1">Rival Squad Matchmaking • Zero Online Fee Cuts • Settle at Counter</p>
      </div>
      <div class="text-right">
        <span class="text-xs text-zinc-500 block">Current Player Session:</span>
        <span id="sessionDisplay" class="text-xs text-emerald-300 font-mono">Not set (auto-saved on action)</span>
      </div>
    </header>

    <!-- Hosting Form -->
    <section class="bg-zinc-900/80 border border-zinc-800 rounded-xl p-5 md:p-6 shadow-xl">
      <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
        <span>🛡️</span> Offer a Challenge
      </h2>

      <form id="hostForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">HOST SQUAD NAME (TEAM 1)</label>
            <input type="text" id="hostTeam" required placeholder="e.g. Shivana FC" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">TURF VENUE & LOCATION</label>
            <input type="text" id="turfName" required placeholder="e.g. XYZ Turf, Prem Nagar" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">SPORT</label>
            <select id="sportType" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
              <option value="Football">Football</option>
              <option value="Box Cricket">Box Cricket</option>
              <option value="Badminton">Badminton</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">DATE</label>
            <input type="date" id="matchDate" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">TIME SLOT (START TIME OR RANGE)</label>
            <input type="text" id="matchTime" required placeholder="e.g. 19:00 - 20:00 or 19:00" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">YOUR WHATSAPP NUMBER (10 DIGITS)</label>
            <input type="tel" id="hostContact" required placeholder="e.g. 9876543210" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">SETTLEMENT TERMS</label>
          <select id="stakes" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="50-50">50-50 Split (Each squad pays 50% at counter)</option>
            <option value="Lose-to-Pay">Lose-to-Pay (Losing squad pays full ground rent)</option>
          </select>
        </div>

        <!-- Venue Verification Checkbox -->
        <div class="p-3.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-left">
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input 
              type="checkbox" 
              id="turfSlotConfirmed" 
              required 
              class="mt-1 h-4 w-4 rounded border-zinc-600 bg-zinc-800 text-emerald-500 focus:ring-0"
            />
            <span class="text-xs text-zinc-300 leading-relaxed">
              <strong class="text-amber-400 block font-semibold mb-0.5">⚠️ Important Venue Policy:</strong>
              I confirm that I have contacted the turf owner and verified that this time slot is free. 
              <strong>TurfClash is strictly a matchmaking platform to find opponents</strong>, not for booking pitches. All turf rental fees must be settled directly with the venue desk.
            </span>
          </label>
        </div>

        <button 
          type="submit" 
          id="hostSubmitBtn"
          class="w-full py-2.5 px-4 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-emerald-500/10"
        >
          Offer a Challenge
        </button>
      </form>
    </section>

    <!-- Match Fixtures Feed -->
    <section class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <span>🏟️</span> Active Pitch Challenges
        </h2>
        <button onclick="loadMatches()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700">
          🔄 Refresh
        </button>
      </div>

      <div id="matchFeed" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Fixtures populate here -->
      </div>
    </section>
  </div>

  <script>
    // Replace with your active Render backend URL
    const API_BASE = "https://turf-matchmaker.onrender.com";

    // 1. Min selectable date = today
    const dateInput = document.getElementById("matchDate");
    if (dateInput) {
      dateInput.min = new Date().toISOString().split("T")[0];
    }

    // 2. Display stored user session phone
    function updateSessionDisplay() {
      const storedPhone = localStorage.getItem("turf_user_phone");
      const display = document.getElementById("sessionDisplay");
      if (storedPhone) {
        display.textContent = `${storedPhone.slice(0, 2)}******${storedPhone.slice(-2)}`;
      } else {
        display.textContent = "None (guest)";
      }
    }

    // 3. Form Validation & Submission
    const hostForm = document.getElementById("hostForm");
    const turfCheckbox = document.getElementById("turfSlotConfirmed");
    const submitBtn = document.getElementById("hostSubmitBtn");

    if (turfCheckbox && submitBtn) {
      submitBtn.disabled = !turfCheckbox.checked;
      turfCheckbox.addEventListener("change", () => {
        submitBtn.disabled = !turfCheckbox.checked;
      });
    }

    hostForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const selectedDate = document.getElementById("matchDate").value;
      const selectedTime = document.getElementById("matchTime").value.trim();
      const hostPhone = document.getElementById("hostContact").value.trim();

      // Extract kickoff time
      const timeToCheck = selectedTime.includes("-") ? selectedTime.split("-")[0].trim() : selectedTime;
      const formattedTime = timeToCheck.length === 4 && timeToCheck.indexOf(":") === 1 ? `0${timeToCheck}` : timeToCheck;

      // 5-minute pre-kickoff check
      const kickoffDateTime = new Date(`${selectedDate}T${formattedTime}:00`);
      const cutoffTime = new Date(kickoffDateTime.getTime() - 5 * 60 * 1000);
      const now = new Date();

      if (now >= cutoffTime) {
        alert("Challenges must be scheduled at least 5 minutes before kickoff time!");
        return;
      }

      if (!turfCheckbox.checked) {
        alert("Please confirm that the turf slot has been checked with the venue owner.");
        return;
      }

      localStorage.setItem("turf_user_phone", hostPhone);
      updateSessionDisplay();

      const payload = {
        turf_name: document.getElementById("turfName").value.trim(),
        sport: document.getElementById("sportType").value,
        date: selectedDate,
        time: selectedTime,
        host_team: document.getElementById("hostTeam").value.trim(),
        host_contact: hostPhone,
        stakes: document.getElementById("stakes").value,
        slot_confirmed_with_owner: turfCheckbox.checked
      };

      try {
        const res = await fetch(`${API_BASE}/api/matches`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to post challenge.");

        alert("Challenge posted! Teams can now accept your fixture.");
        hostForm.reset();
        submitBtn.disabled = true;
        loadMatches();
      } catch (err) {
        alert(err.message);
      }
    });

    // 4. Fetch & Render Matches with Opponent Privacy
    async function loadMatches() {
      const userPhone = localStorage.getItem("turf_user_phone") || "";
      const feed = document.getElementById("matchFeed");

      try {
        const res = await fetch(`${API_BASE}/api/matches`, {
          headers: { "x-user-phone": userPhone }
        });
        const matches = await res.json();

        if (!matches || matches.length === 0) {
          feed.innerHTML = `
            <div class="col-span-full py-12 text-center text-zinc-500 border border-dashed border-zinc-800 rounded-xl">
              No active challenges right now. Offer a challenge above!
            </div>
          `;
          return;
        }

        feed.innerHTML = matches.map(m => renderCard(m)).join("");
      } catch (err) {
        feed.innerHTML = `<p class="col-span-full text-rose-400 text-xs text-center py-4">Failed to load fixtures. Please check your backend connection.</p>`;
      }
    }

    // 5. Render Individual Card
    function renderCard(m) {
      const isConfirmed = m.status === "CONFIRMED" || m.status === "FIXED";

      let statusBadge = isConfirmed
        ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded">LOCKED / CONFIRMED</span>`
        : `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded">OPEN CHALLENGE</span>`;

      let actionSection = "";

      if (isConfirmed) {
        if (m.can_chat && m.opponent_phone) {
          const cleanPhone = m.opponent_phone.replace(/[^0-9]/g, "");
          const waUrl = `https://wa.me/${cleanPhone}?text=Hey!%20Match%20fixed%20for%20${encodeURIComponent(m.turf_name)}%20on%20${encodeURIComponent(m.date)}%20(${encodeURIComponent(m.time)})`;
          actionSection = `
            <a href="${waUrl}" target="_blank" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded text-xs text-center flex items-center justify-center gap-1.5 transition-colors">
              <span>💬</span> WhatsApp Opponent
            </a>
          `;
        } else {
          actionSection = `
            <div class="text-[11px] text-zinc-500 bg-zinc-800/80 border border-zinc-700/60 rounded px-2.5 py-1.5 text-center">
              🔒 Contact locked to competing squads
            </div>
          `;
        }
      } else {
        // Match is OPEN
        if (m.is_host) {
          actionSection = `
            <button onclick="cancelMatch(${m.id})" class="w-full py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 rounded text-xs font-semibold transition-all">
              Cancel Challenge
            </button>
          `;
        } else {
          actionSection = `
            <button onclick="acceptMatch(${m.id})" class="w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded text-xs transition-colors">
              Accept Challenge
            </button>
          `;
        }
      }

      return `
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">${m.sport}</span>
              ${statusBadge}
            </div>
            <h3 class="font-bold text-white text-base">${m.turf_name}</h3>
            <p class="text-xs text-zinc-400 mt-0.5">🗓️ ${m.date} &nbsp;•&nbsp; ⏰ ${m.time}</p>
            <div class="mt-3 p-2 bg-zinc-800/50 rounded border border-zinc-700/40 text-xs">
              <p class="text-zinc-300"><span class="text-zinc-500 font-medium">Host:</span> ${m.host_team}</p>
              ${m.challenger_team ? `<p class="text-zinc-300 mt-1"><span class="text-zinc-500 font-medium">Rival:</span> ${m.challenger_team}</p>` : ''}
              <p class="text-zinc-400 text-[11px] mt-1"><span class="text-zinc-500">Stakes:</span> ${m.stakes}</p>
            </div>
          </div>
          <div class="pt-2">
            ${actionSection}
          </div>
        </div>
      `;
    }

    // 6. Accept Challenge
    async function acceptMatch(matchId) {
      const teamName = prompt("Enter your Team/Squad Name:");
      if (!teamName) return;

      const phone = prompt("Enter your 10-digit WhatsApp Number to connect with host:");
      if (!phone) return;

      localStorage.setItem("turf_user_phone", phone.trim());
      updateSessionDisplay();

      try {
        const res = await fetch(`${API_BASE}/api/matches/${matchId}/accept`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            challenger_team: teamName.trim(),
            challenger_contact: phone.trim()
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to accept challenge.");

        alert("Challenge Accepted! Match is locked. You can now contact each other via WhatsApp.");
        loadMatches();
      } catch (err) {
        alert(err.message);
      }
    }

    // 7. Cancel Hosted Match
    async function cancelMatch(matchId) {
      if (!confirm("Are you sure you want to cancel this hosted challenge?")) return;

      const userPhone = localStorage.getItem("turf_user_phone") || "";

      try {
        const res = await fetch(`${API_BASE}/api/matches/${matchId}`, {
          method: "DELETE",
          headers: { "x-user-phone": userPhone }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to cancel match.");

        alert("Challenge cancelled successfully.");
        loadMatches();
      } catch (err) {
        alert(err.message);
      }
    }

    // Initial Load
    updateSessionDisplay();
    loadMatches();
  </script>
</body>
</html>
